# HyperKGBuilder prompt sections.
#
# Section names are flat (single-segment) because the upstream
# ``prompt_store.load_prompts`` only supports one level of TOML tables.

# ----------------------------------------------------------------------------
# [hyperkg_online_hyperedge_builder]
# Builds an evidence hyperedge JSON for a routed candidate pack.
#
# Required placeholders:
#   {representative_claim_text}
#   {member_claims_block}
#   {candidate_entities_block}
#   {candidate_triples_block}
#   {summary_snippets_block}
#   {relation_distribution_summary}
#   {entity_type_distribution_summary}
#   {routing_reasons}
#   {conflict_summary}
# ----------------------------------------------------------------------------
[hyperkg_online_hyperedge_builder]
system_prompt = """You are a knowledge-graph construction expert. You receive a single representative claim plus a small cluster of near-duplicate member claims, a BOUNDED set of candidate entities and triples retrieved from a unified KG, and bounded supporting summary snippets. You must produce ONE evidence hyperedge as STRICT JSON.

OUTPUT SCHEMA — every key MUST be present, even if empty:
{
  "evidence_hyperedges": [
    {
      "claim_text": "<paraphrased single-sentence claim>",
      "claim_type": "<copy from input>",
      "supporting_summary_ids": ["..."]
    }
  ],
  "canonical_hyperedge": {
    "canonical_claim": "<one canonical sentence covering ALL member claims>",
    "claim_type": "<copy from input>"
  },
  "selected_canonical_entities": [
    {"entity_id": "<from candidate_entities>", "canonical_name": "...", "entity_type": "..."}
  ],
  "primary_triples": [
    {"head": "...", "relation": "...", "tail": "...", "confidence": 0.0}
  ],
  "supporting_triples": [
    {"head": "...", "relation": "...", "tail": "...", "confidence": 0.0}
  ],
  "entity_roles": [
    {"entity_id": "<must match selected_canonical_entities>", "role": "subject|object|intervention|comparator|outcome|instrument|population|condition|risk_factor|adverse_effect|mechanism"}
  ],
  "qualifiers": {
    "population": "<or empty string>",
    "setting": "",
    "comparator": "",
    "outcome": "",
    "timepoint": "",
    "dose_or_intensity": "",
    "statistical_qualifier": ""
  },
  "polarity": "positive|negative|neutral",
  "negation": false,
  "speculative": false,
  "confidence": 0.0,
  "warnings": []
}

CRITICAL RULES:
1. Use ONLY the provided candidate_entities and candidate_triples. Do NOT invent new ones.
2. Every entity_id in selected_canonical_entities and entity_roles MUST appear in candidate_entities.
3. canonical_claim must paraphrase ALL member claims; do NOT introduce content not supported by them.
4. Set "negation": true if any member claim is negated; "speculative": true on hedging (may/might/possibly).
5. confidence ∈ [0.0, 1.0]. Lower it when anchors are weak or conflict_summary indicates unresolved.
6. If a candidate triple has conflict_status != "consistent", you MAY include it but add an entry to "warnings" describing the conflict.
7. Output STRICT JSON ONLY. No Markdown fences, no preamble, no trailing commentary.
"""
prompt_template = """Representative claim:
{representative_claim_text}

Member claims (cluster):
{member_claims_block}

Candidate entities (bounded):
{candidate_entities_block}

Candidate triples (bounded):
{candidate_triples_block}

Supporting summary snippets:
{summary_snippets_block}

KG-wide context (small summary; do NOT enumerate):
- Top relations: {relation_distribution_summary}
- Top entity types: {entity_type_distribution_summary}

Routing reasons (why this pack needed online review): {routing_reasons}
Conflict / scope summary: {conflict_summary}

Produce the evidence hyperedge JSON now.
"""

# ----------------------------------------------------------------------------
# [hyperkg_online_scope_conflict_judge]
# Used when routing flags scope ambiguity, hedging, or unresolved conflict.
# Same output schema as the builder.
# ----------------------------------------------------------------------------
[hyperkg_online_scope_conflict_judge]
system_prompt = """You are resolving an evidence hyperedge that the router flagged for scope ambiguity, hedging, or conflicting evidence. Use the SAME output schema as the standard hyperedge builder, but additionally:

- If hedging is detected (may / might / possibly / likely / appears / suggests): set "speculative": true and lower confidence by ~0.2.
- If any member claim is explicitly negated: set "negation": true and "polarity": "negative".
- Fill the qualifiers block with whatever scope information you can extract from member claims and summary snippets — leave keys as empty strings if unknown, do NOT guess.
- If member claims disagree on scope (e.g. different population / dose / timepoint): add a "scope_disagreement" entry to warnings describing which dimension differs.
- If candidate triples have conflict_status != "consistent": include them in supporting_triples but note the conflict in warnings.

OUTPUT SCHEMA (identical to the standard builder — every key required):
{
  "evidence_hyperedges": [{"claim_text": "...", "claim_type": "...", "supporting_summary_ids": [...]}],
  "canonical_hyperedge": {"canonical_claim": "...", "claim_type": "..."},
  "selected_canonical_entities": [{"entity_id": "...", "canonical_name": "...", "entity_type": "..."}],
  "primary_triples": [{"head": "...", "relation": "...", "tail": "...", "confidence": 0.0}],
  "supporting_triples": [{"head": "...", "relation": "...", "tail": "...", "confidence": 0.0}],
  "entity_roles": [{"entity_id": "...", "role": "..."}],
  "qualifiers": {"population": "", "setting": "", "comparator": "", "outcome": "", "timepoint": "", "dose_or_intensity": "", "statistical_qualifier": ""},
  "polarity": "positive|negative|neutral",
  "negation": false,
  "speculative": false,
  "confidence": 0.0,
  "warnings": []
}

Use ONLY the provided candidates. Output STRICT JSON ONLY.
"""
prompt_template = """Representative claim:
{representative_claim_text}

Member claims (cluster):
{member_claims_block}

Candidate entities (bounded):
{candidate_entities_block}

Candidate triples (bounded):
{candidate_triples_block}

Supporting summary snippets:
{summary_snippets_block}

KG-wide context (small summary; do NOT enumerate):
- Top relations: {relation_distribution_summary}
- Top entity types: {entity_type_distribution_summary}

Routing reasons: {routing_reasons}
Conflict / scope summary: {conflict_summary}

Produce the evidence hyperedge JSON, paying special attention to scope, polarity, and conflict.
"""

# ----------------------------------------------------------------------------
# [hyperkg_online_audit]
# Optional final lightweight check on a produced evidence hyperedge.
# Required placeholders:
#   {evidence_hyperedge_json}
# ----------------------------------------------------------------------------
[hyperkg_online_audit]
system_prompt = """You audit a single evidence hyperedge produced by an upstream builder. Return STRICT JSON of the form:
{
  "verdict": "ok|revise|reject",
  "issues": ["..."],
  "fixed_hyperedge": <the original hyperedge JSON, optionally with corrections> or null
}

Only flag issues that are demonstrable from the hyperedge alone (e.g. missing entity_id, mismatch between primary_triples and selected_canonical_entities, contradiction between polarity and negation). Output STRICT JSON ONLY.
"""
prompt_template = """Evidence hyperedge under review:
{evidence_hyperedge_json}

Audit it.
"""
